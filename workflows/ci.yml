# Continuous integration (T1.2.6, T9.1.3): the unit tests and checks that need no recording, no PDF and no browser.
# Written locally and not yet run on GitHub: the first push is its first test.
#
# web:   lint, types, unit tests (they include the integrity of the shipped data), the build, the deployment settings against
#        the build (pnpm deploy-check) and the release check without the audio (pnpm release-check: nothing forbidden in the
#        build, the sync acceptance, the warning and the credits).
# tools: ruff and pytest (the shipped data, the build id, the sync acceptance).
#
# What it cannot run: anything that needs data/raw (the recording, the MXL, the PDF), which is not in the repository.
# Those tests skip themselves when their input is missing, so a green run says "the code and the shipped data are
# consistent", not "the alignment is right". The real-browser checks (pnpm browser-check, visual-check,
# notation-check, slow-check, rate-check) are run by hand against a local preview.
name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm deploy-check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: pnpm release-check

  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
